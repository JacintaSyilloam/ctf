<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-neutral-50 font-sans">
    <main class="mx-auto max-w-2xl px-4 py-8">
        <div class="mb-5 flex items-end justify-between">
            <h1 class="text-2xl font-semibold text-neutral-900">Admin · Anonymous Message Portal</h1>
            <button onclick="window.location.href='/'" class="rounded-md border border-neutral-300 px-3 py-1.5 text-sm text-neutral-700 hover:bg-neutral-100">Home</button>
        </div>

        <div class="rounded-xl border border-neutral-200 bg-white shadow-sm">
            <div class="p-5">
                <p class="text-neutral-600 mb-4">Welcome, admin! This page is protected and only accessible with the admin cookie.</p>
                <p class="text-neutral-600 mb-4">FLAG{babyxss_is_fun}</p>
                <div class="flex items-end gap-3">
                    <div class="flex-1">
                        <label for="noteId" class="block text-sm mb-1 text-neutral-600">Open message by ID</label>
                        <input id="noteId" type="text" placeholder="Enter message ID" class="w-full rounded-lg border border-neutral-300 bg-white p-2.5 text-[15px] placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-800/10 focus:border-neutral-400" />
                    </div>
                    <button id="openNoteBtn" type="button" class="rounded-md border border-neutral-300 bg-white px-4 py-2 text-sm hover:bg-neutral-100">Open</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        (function () {
            var btn = document.getElementById('openNoteBtn');
            if (!btn) return;
            btn.addEventListener('click', function () {
                var id = (document.getElementById('noteId') || {}).value || '';
                id = id.trim();
                if (id) {
                    window.location.href = '/' + encodeURIComponent(id);
                }
            });
        })();
    </script>
</body>
</html>
